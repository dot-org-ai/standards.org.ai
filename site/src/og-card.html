<!doctype html>
<!-- Source for /og.png (1200×630). Rendered ONCE by headless Chrome and
     committed as src/og.png, so ordinary builds never need a browser; the
     build only copies it. Fetched by link unfurlers, never by the page, so
     the one-request law is untouched.

     Tokens are hard-coded literals mirroring the DARK palette in styles.css.
     A share card has no prefers-color-scheme, so it commits to dark. Keep
     them in step by hand if the palette moves.

     The object is TWO STACKED BARS, not foundation's single vertical edge:
     foundation's edge belongs to foundation, and this page's subject is two
     shelves. Upper = theirs, --ink-3, because nothing on that shelf is open.
     Lower = ours, --now, because seven addresses resolve today.

     The font path is RELATIVE on purpose. Render with the working directory
     at src/. An absolute path falls back silently to the system face and the
     card ships in the wrong typeface — the single most breakable thing in
     this pipeline. The card sets 550 and 600, so the subset's axis range must
     cover them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Public Sans";
    src: url("fonts/publicsans-subset.woff2") format("woff2");
    font-weight: 200 700;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #13110e;                     /* --ground, dark */
    font-family: "Public Sans", system-ui, sans-serif;
    color: #f3f2ee;                          /* --ink, dark */
    overflow: hidden;
  }
  .in {
    height: 100%; padding: 84px 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; }
  .bars { margin-bottom: 32px; }
  .bar { width: 128px; height: 7px; border-radius: 0; }
  .bar-theirs { background: #8d8b87; }       /* --ink-3, dark */
  .bar-ours   { background: #f0af66; margin-top: 18px; }   /* --now, dark */
  .wordmark {
    font-size: 30px; font-weight: 600; letter-spacing: 0;
    color: #bdbbb8;                          /* --ink-2, dark */
  }
  .substance {
    font-size: 58px; font-weight: 550; line-height: 1.22; letter-spacing: -0.015em;
    max-width: 940px;
  }
  .substance em { font-style: normal; color: #f0af66; }
  .host { font-size: 26px; font-weight: 400; color: #8d8b87; }
</style>
</head>
<body>
  <div class="in">
    <div class="top">
      <div class="bars">
        <div class="bar bar-theirs"></div>
        <div class="bar bar-ours"></div>
      </div>
      <div class="wordmark">The Org.AI Foundation · Standards</div>
    </div>
    <div class="substance">Other people's records, copied and <em>never&nbsp;corrected</em>.<br>Ours on a second shelf, marked&nbsp;unfinished.</div>
    <div class="host">standards.org.ai</div>
  </div>
</body>
</html>
